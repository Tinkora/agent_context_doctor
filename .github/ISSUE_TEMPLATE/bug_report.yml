name: Bug report
description: Report a reproducible Agent Context Doctor defect with a synthetic fixture.
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: format
    attributes:
      label: Output format
      options:
        - text
        - json
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exit status and rule identifiers, but remove sensitive metadata.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Never include real paths, repository names, instruction contents, configuration values, credentials, or raw host output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, selected host, and Agent Context Doctor version.
    validations:
      required: true
